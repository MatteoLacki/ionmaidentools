[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name="ionmaidentools"
version="0.0.1"
description="Necroflow pipeline definitions and CLI wrapper tools for the ionmaiden project."
readme="README.md"
authors=[
    {name="MatteoLacki",email="matteo.lacki@gmail.com"},
]
requires-python = ">=3.11"
dependencies = [
    "tomlkit",
    "dictodot",
]

[project.optional-dependencies]
dev = [
    "pytest",
]


[project.urls]
homepage="https://github.com/MatteoLacki/ionmaidentools.git"
repository="https://github.com/MatteoLacki/ionmaidentools.git"

[tool.uv]
reinstall-package = ["ionmaidentools"]

# [tool.pytest.ini_options]
# testpaths = ["tests"]


[tool.setuptools.packages.find]
where = ["src"]

